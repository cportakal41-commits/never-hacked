services:
  # ── Flask Web Servisi ──────────────────────────────────────────────────────
  - type: web
    name: never-hacked
    runtime: python
    region: frankfurt          # Türkiye'ye en yakın
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -b 0.0.0.0:$PORT --workers=2 "app:create_app()"
    healthCheckPath: /health
    envVars:
      - key: FLASK_APP
        value: app
      - key: SECRET_KEY
        generateValue: true        # Render otomatik üretir
      - key: JWT_SECRET_KEY
        generateValue: true        # Render otomatik üretir
      - key: DATABASE_URL
        fromDatabase:
          name: never-hacked-db
          property: connectionString
      - key: LOG_LEVEL
        value: INFO

  # ── PostgreSQL Veritabanı ──────────────────────────────────────────────────
databases:
  - name: never-hacked-db
    region: frankfurt
    plan: free
    databaseName: never_hacked
    user: never_hacked_admin
